services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - sqlite_data:/data
    command:
      - sh
      - -c
      - python manage.py migrate && python manage.py runserver 0.0.0.0:8000
volumes:
  sqlite_data:
